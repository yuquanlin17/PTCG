<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卡价扫描">
<link rel="manifest" href="manifest.json">
<title>PTCG 卡价扫描</title>
<style>
/* 布局：底部双标签（扫描 / 收藏），单列手机优先 */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --fg: #16181f;
  --muted: #6b7080;
  --line: #e1e3ea;
  --accent: #e2a019;       /* 闪卡金 */
  --accent-ink: #1b1400;
  --good: #1f9d5b;
  --bad: #d0423a;
  --shade: rgba(10, 12, 20, .55);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1116; --surface: #1a1d25; --fg: #eef0f5; --muted: #9096a6; --line: #2a2e39;
    --accent: #f0b43a; --accent-ink: #1b1400; --good: #3cc47c; --bad: #ef6a62; --shade: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1116; --surface: #1a1d25; --fg: #eef0f5; --muted: #9096a6; --line: #2a2e39;
  --accent: #f0b43a; --accent-ink: #1b1400; --good: #3cc47c; --bad: #ef6a62; --shade: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font);
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px 10px; }
header.top h1 { font-size: 19px; margin: 0; letter-spacing: .02em; white-space: nowrap; }
header.top h1 .ver { display: block; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 1px; }

/* 货币切换 */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 4px 8px; font-size: 12.5px; font-family: var(--mono); color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.viewfinder { position: relative; width: 100%; aspect-ratio: 3 / 4; max-width: 100%; background: #000; border-radius: 14px; overflow: hidden; }
.viewfinder.idle { aspect-ratio: auto; height: 150px; }
.viewfinder video, .viewfinder img.preview { width: 100%; height: 100%; object-fit: cover; display: block; }
.viewfinder img.preview { object-fit: contain; }
.guide { position: absolute; left: 50%; top: 50%; width: 72%; aspect-ratio: 63 / 88; transform: translate(-50%, -50%);
  border: 2px solid rgba(255,255,255,.9); border-radius: 10px; box-shadow: 0 0 0 2000px var(--shade); pointer-events: none; }
.guide::after { content: "卡底部编号对准这条线"; position: absolute; left: -2px; right: -2px; bottom: -2px; height: 15%;
  border: 2px dashed var(--accent); border-radius: 0 0 10px 10px; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 2px #000; }
.guide.scanning::after { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { border-color: rgba(255,255,255,.35); } }
.vf-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #cfd3dd; text-align: center; padding: 20px; font-size: 14px; }
.vf-empty small { font-size: 12px; opacity: .75; }

.scanbtn { width: 100%; margin-top: 10px; padding: 15px; font-size: 17px; font-weight: 700; border-radius: 14px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.scanbtn.stop { background: var(--surface); color: var(--fg); border-color: var(--line); }
.linkrow { display: flex; justify-content: center; gap: 24px; margin-top: 6px; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 8px 2px; text-decoration: underline; text-underline-offset: 3px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .5; }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 9px; }

.manual { display: flex; gap: 8px; margin-top: 10px; }
.manual input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; }

.status { margin-top: 12px; font-size: 13px; color: var(--muted); min-height: 1.4em; scroll-margin-top: 12px; }
.status code { font-family: var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; color: var(--fg); }

.peek { margin-top: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.results { display: grid; gap: 10px; margin-top: 8px; }
.card { display: grid; grid-template-columns: 76px 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: left; width: 100%; }
.card img, .card .ph { width: 76px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 6px; background: var(--line); }
.card .ph { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-family: var(--mono); font-size: 12px; text-align: center; overflow-wrap: anywhere; padding: 4px; }
.card .ph b { color: var(--fg); font-size: 13px; }
.card .meta { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.card .name { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .sub { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.lang-pill { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--fg); color: var(--bg); }
.price { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; }
.price.na { font-size: 14px; color: var(--muted); font-family: var(--font); font-weight: 500; }
.price-src { font-size: 12px; margin-left: 6px; font-family: var(--font); font-weight: 500; color: var(--muted); }
.pill { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.saved { border-color: var(--good); color: var(--good); }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }

/* 收藏 */
.summary { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 12px; }
.summary .total { font-family: var(--mono); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.summary small { color: var(--muted); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.fchip b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 4px; }
.fchip[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.fchip[aria-selected="true"] b { color: var(--bg); opacity: .75; }
.sortrow { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
.sortrow select { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 8px; font-size: 13px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.qty button { border: 0; background: transparent; width: 34px; height: 30px; font-size: 18px; }
.qty input { width: 40px; border: 0; border-inline: 1px solid var(--line); background: transparent; text-align: center; height: 30px; font-family: var(--mono); }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; border: 1px dashed var(--line); border-radius: 14px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.confirm { display: flex; gap: 6px; align-items: center; font-size: 13px; flex-wrap: wrap; }

nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr 1fr; padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.bottom button { border: 0; background: transparent; padding: 12px 0 14px; font-size: 14px; color: var(--muted); font-weight: 600; }
nav.bottom button[aria-current="page"] { color: var(--fg); }
nav.bottom button[aria-current="page"]::before { content: ""; display: block; width: 28px; height: 3px; border-radius: 3px; background: var(--accent); margin: -12px auto 9px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
  padding: 9px 14px; border-radius: 10px; font-size: 13px; max-width: calc(100% - 32px); z-index: 10; }
.settings { margin-top: 14px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.settings input { width: 70px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 8px; font-family: var(--mono); }
.field { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--bg); width: 100%; min-width: 0; }
/* 价格曲线面板（点卡片打开） */
.card[data-clickable] { cursor: pointer; }
.card[data-clickable]:active { background: var(--bg); }
.sheet-bg { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; max-height: 92%; overflow-y: auto;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: start; }
.sheet-head img, .sheet-head .ph { width: 64px; aspect-ratio: 63 / 88; object-fit: cover; border-radius: 6px; background: var(--line); }
.sheet-head .ph { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sheet-close { border: 0; background: var(--bg); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--muted); }
.sheet .big { font-family: var(--mono); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chg { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.chg.up { color: var(--good); } .chg.down { color: var(--bad); } .chg.flat { color: var(--muted); }
.ranges { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 2px; margin: 14px 0 8px; }
.ranges button { border: 0; background: transparent; border-radius: 8px; padding: 5px 9px; font-size: 13px; color: var(--muted); }
.ranges button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chart { position: relative; width: 100%; height: 200px; touch-action: none; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-align: center; padding: 0 12px; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 5px 8px; font-size: 12px; line-height: 1.35; white-space: nowrap; transform: translateX(-50%); }
.tip b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stats div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.stats small { display: block; color: var(--muted); font-size: 11.5px; }
.stats b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.sheet .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>PTCG 卡价扫描<span class="ver" id="appVer"></span></h1>
    <div class="seg" role="group" aria-label="显示货币" id="curSeg">
      <button data-cur="USD">USD $</button>
      <button data-cur="JPY">JPY ¥</button>
      <button data-cur="CNY">CNY ¥</button>
    </div>
  </header>

  <!-- 扫描页 -->
  <section id="pageScan">
    <div class="viewfinder idle" id="vf">
      <video id="video" playsinline muted hidden></video>
      <img id="preview" class="preview" alt="" hidden>
      <div class="guide" id="guide" hidden></div>
      <div class="vf-empty" id="vfEmpty">
        <div>点「开始扫描」，把卡放进框里就会自动识别</div>
        <small>日版 · 美版 · 简中 · 繁中 自动判断</small>
      </div>
    </div>

    <button class="scanbtn" id="scanBtn">开始扫描</button>
    <form class="manual" id="manualForm">
      <input id="manualIn" type="search" enterkeyhint="search" placeholder="或者直接输入：M3 110 / SV5a 59 / PAF 232" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="输入系列代码和编号查询">
      <button class="btn" type="submit">查询</button>
    </form>
    <div class="linkrow">
      <label class="linkbtn" for="pickIn">从相册选图</label>
    </div>
    <input type="file" id="shootIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="pickIn" accept="image/*" hidden>

    <div class="status" id="status"></div>
    <div class="peek" id="ocrPeek" hidden></div>
    <div class="peek" id="visPeek" hidden></div>
    <div class="results" id="results"></div>
  </section>

  <!-- 收藏页 -->
  <section id="pageLib" hidden>
    <div class="summary">
      <div><div class="total" id="libTotal">$0.00</div><div id="libChg"></div><small id="libCount">0 张</small></div>
      <button class="btn small" id="refreshBtn">刷新价格</button>
    </div>
    <div class="filters" role="tablist" aria-label="按版本筛选" id="libFilters"></div>
    <div class="sortrow">
      <label for="sortSel">排序</label>
      <select id="sortSel">
        <option value="added-desc">添加时间 新 → 旧</option>
        <option value="added-asc">添加时间 旧 → 新</option>
        <option value="price-desc">价格 高 → 低</option>
        <option value="price-asc">价格 低 → 高</option>
        <option value="set-new">版本 新 → 旧</option>
        <option value="set-old">版本 旧 → 新</option>
      </select>
    </div>
    <div class="results" id="libList"></div>
    <div class="tools">
      <button class="btn small" id="exportBtn">导出备份</button>
      <label class="btn small" for="importIn">导入备份</label>
      <input type="file" id="importIn" accept="application/json,.json" hidden>
    </div>
    <div class="settings">
      <label for="thresholdIn">价格 ≥ $</label>
      <input id="thresholdIn" type="number" min="0" step="0.5" inputmode="decimal">
      <span>USD 的卡扫描后自动加入收藏</span>
    </div>
    <div class="settings" id="fxLine"></div>
    <form class="settings" id="proxyForm" hidden>
      <label for="proxyIn">价格服务器</label>
      <input id="proxyIn" type="url" placeholder="https://xxx.workers.dev" style="flex:1;min-width:180px;width:auto" autocomplete="off">
      <button class="btn small" type="submit">保存</button>
      <span id="proxyState"></span>
    </form>
    <div class="settings" id="lastRefresh"></div>
  </section>
</div>

<nav class="bottom">
  <button id="navScan" aria-current="page">扫描</button>
  <button id="navLib">收藏</button>
</nav>
<div class="toast" id="toast" hidden></div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shName">
    <div class="sheet-head">
      <i id="shImg"></i>
      <div style="min-width:0">
        <div class="name" id="shName" style="font-weight:700;font-size:16px;overflow-wrap:anywhere"></div>
        <div class="sub" id="shSub" style="color:var(--muted);font-size:12.5px;overflow-wrap:anywhere"></div>
        <div><span class="big" id="shPrice"></span> <span class="chg" id="shChg"></span></div>
      </div>
      <button class="sheet-close" id="shClose" aria-label="关闭">×</button>
    </div>
    <div class="ranges" role="group" aria-label="时间范围">
      <button data-range="month">1月</button>
      <button data-range="quarter">3月</button>
      <button data-range="annual">1年</button>
      <button data-range="y3">3年</button>
      <button data-range="y5">5年</button>
      <button data-range="all">全部</button>
    </div>
    <div class="chart" id="shChart"></div>
    <div class="stats">
      <div><small>最高</small><b id="shHi">—</b></div>
      <div><small>最低</small><b id="shLo">—</b></div>
      <div><small>成交量</small><b id="shVol">—</b></div>
    </div>
    <div class="note" id="shNote"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
"use strict";
const API = "https://api.tcgdex.net/v2";
const LANGS = { ja: "日版", en: "美版", "zh-cn": "简中", "zh-tw": "繁中" };
const LANG_KEYS = Object.keys(LANGS);
const REFRESH_MS = 60 * 60 * 1000; // 每小时刷新一次
// 美版卡底印的系列简称 → TCGdex 系列 id（朱紫时代起卡上才印简称，更早的卡按「编号/总数」匹配）
const EN_ABBR = { SVI: "sv01", SVE: "sve", SVP: "svp", PAL: "sv02", MCD23: "2023sv", OBF: "sv03", MEW: "sv03.5", MFB: "mfb",
  PAR: "sv04", PAF: "sv04.5", TEF: "sv05", TWM: "sv06", SFA: "sv06.5", SCR: "sv07", SSP: "sv08", MCD24: "2024sv", PRE: "sv08.5",
  JTG: "sv09", DRI: "sv10", BLK: "sv10.5b", WHT: "sv10.5w", MEE: "mee", MEG: "me01", MEP: "mep", PFL: "me02", ASC: "me02.5",
  POR: "me03", CRI: "me04", PBL: "me05", "30C": "30th" };
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------- 存储 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let lib = store.get("ptcg.lib", []);          // 收藏（价格统一按美元存）
let threshold = store.get("ptcg.threshold", 5);
let libFilter = store.get("ptcg.filter", "all");
let libSort = store.get("ptcg.sort", "added-desc");
const saveLib = () => store.set("ptcg.lib", lib);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

// ---------- 汇率与货币 ----------
const CUR = { USD: { sym: "$", dec: 2 }, JPY: { sym: "JP¥", dec: 0 }, CNY: { sym: "CN¥", dec: 2 } };
let cur = store.get("ptcg.cur", "USD");
let fx = store.get("ptcg.fx3", { rates: { USD: 1, JPY: 150, CNY: 7.2 }, at: 0 });
async function loadFx() {
  if (Date.now() - fx.at < 12 * 3600e3) return renderFx();
  try {
    const j = await (await fetch("https://open.er-api.com/v6/latest/USD")).json();
    if (j && j.rates && j.rates.JPY && j.rates.CNY) {
      fx = { rates: { USD: 1, JPY: j.rates.JPY, CNY: j.rates.CNY }, at: Date.now() };
      store.set("ptcg.fx3", fx);
    }
  } catch {}
  renderFx();
}
const toUsd = (v) => v / fx.rates[cur];            // 当前货币 → 美元
const fromUsd = (usd) => usd * fx.rates[cur];       // 美元 → 当前货币
function fmt(usd) {
  const c = CUR[cur];
  return c.sym + fromUsd(usd).toLocaleString("en-US", { minimumFractionDigits: c.dec, maximumFractionDigits: c.dec });
}

    const c = store.get("c." + cacheKey, null);

async function tcgPrice(x) {

  for (const q of queries) {

    if (!items) return null;
    const sameNum = items.filter((p) => parseInt(String(p.number).split("/")[0], 10) === n);
    const setOk = (p) => {
      const s = String(p.set || "").toLowerCase();
      if (x.lang === "en") {

        if (/promo/i.test(x.setName || "") && /promo/.test(s) && !/\//.test(String(p.number))) return true;

    const ok = sameNum.filter(setOk).sort((a, b) => /\(/.test(a.name) - /\(/.test(b.name));

  }

}

// 整个系列逐张比卡图，返回最像的；够像（≥0.8）且明显领先才算认出
async function setImageSearch(sets, sigs, onProgress) {
  if (!sets.length || !sigs.length) return null;
  const scored = [];
  for (const s of sets) {
    const items = ((await tcgSetList(s.slug, s.line).catch(() => null)) || []).filter((p) => /\d/.test(p.number));
    const queue = items.slice();
    let done = 0;
    const work = async () => {
      while (queue.length) {
        const p = queue.shift();
        const sig = await productSig(p.id);
        if (onProgress && ++done % 12 === 0) onProgress(done, items.length);
        if (sig) scored.push({ p, s, sim: Math.max(...sigs.map((q) => simOf(q, sig))) });
      }
    };
    await Promise.all(Array.from({ length: 6 }, work));
  }
  scored.sort((a, b) => b.sim - a.sim);
  if (!scored.length) return null;
  const best = scored[0], second = scored[1];
  const ok = best.sim >= 0.8 && (!second || best.sim - second.sim >= 0.05);
  return { ok, best, second, scored };
}

function lcsLen(a, b) {
  const d = new Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) {
    let prev = 0;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = a[i - 1] === b[j - 1] ? prev + 1 : Math.max(d[j], d[j - 1]); prev = t; }

  const win = a.length + 2;
  let best = 0;
  for (let i = 0; i + 1 <= Math.max(1, b.length - win + 1); i++) best = Math.max(best, lcsLen(a, b.slice(i, i + win)) / a.length);

async function resolveByName(cands, text) {

  const scored = [];

  }
  scored.sort((a, b) => b.s - a.s);
  const best = scored[0];

  const sameCard = (x) => String(x.c.setId).toUpperCase() === String(best.c.setId).toUpperCase() && x.c.localId === best.c.localId;
  const rival = scored.find((x) => !sameCard(x));
  if (rival && best.s - rival.s < 0.2) return { pick: null, scores: scored };

let aiDisabled = false; // 服务器没开 AI 时不再反复请求
async function aiRead(canvas, maxW = 720) {
  const base = proxyUrl();

  const s = Math.min(1, maxW / canvas.width);
  const c = document.createElement("canvas"); c.width = Math.round(canvas.width * s); c.height = Math.round(canvas.height * s);
  c.getContext("2d").drawImage(canvas, 0, 0, c.width, c.height);
  const image = c.toDataURL("image/jpeg", 0.85).split(",")[1];
  try {
    const r = await fetch(`${base}/read`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ image }) });
    if (r.status === 501 || r.status === 404 || r.status === 405) { aiDisabled = true; return null; }
    const j = await r.json();
    return j && j.text && !/^none/i.test(j.text) ? j.text : null;
  } catch { return null; }
}

function liveAiCrop() {

  const gx = (gb.left - box.left + ox) / s, gy = (gb.top - box.top + oy) / s, gw = gb.width / s, gh = gb.height / s;
  const sx = Math.max(0, gx - gw * 0.08), sy = Math.max(0, gy + gh * 0.7), sw = Math.min(vw - sx, gw * 1.16), sh = Math.min(vh - sy, gh * 0.36);
  const c = document.createElement("canvas"); c.width = Math.round(sw); c.height = Math.round(sh);
  c.getContext("2d").drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);

// AI 读到的文字 → 候选卡 → 用卡图核对；返回 { pick, list, parsed }
async function resolveAiText(text, sigs) {
  const parsed = parseText(text, true);
  if (!parsed.nums.length) return null;
  const cands = await identify(parsed);
  if (!cands.length) return { parsed, list: [] };
  if (cands.length === 1) {
    const s = sigs.length ? await imageSim(cands[0], sigs) : null;
    // AI 读到系列代码 + 编号，证据很强；卡图明显不像时才去试形近编号
    if (s === null || s >= 0.4) return { parsed, pick: cands[0], sim: s };
  }
  const ir = await resolveByImage(cands, sigs);
  if (ir && ir.pick) return { parsed, pick: ir.pick, sim: ir.sim };
  // AI 读到的只有一张，形近编号里也没有明显更像的：就是这张
  if (cands.length === 1 && !clearlyBetter(ir, cands[0], 0)) return { parsed, pick: cands[0], sim: null };

function liveCardSigs() {

async function orderByImage(cands, sigs, readNums = []) {

  const isExact = (c) => readNums.some((x) => x.n === parseInt(c.localId, 10) && (!x.total || !c.official || x.total === c.official));
  const scored = [];
  for (const c of cands.slice(0, 10)) { c._sim = await imageSim(c, sigs); c._exact = isExact(c); scored.push(c); }

  return scored
    .filter((c) => c._exact || c._sim == null || top < 0.4 || c._sim >= top - 0.25)

  const scored = [];
  for (const c of cands.slice(0, limit)) {
    const ref = await refSig(c);
    if (ref) scored.push({ c, s: Math.max(...querySigs.map((q) => simOf(q, ref))) });
  }
  scored.sort((a, b) => b.s - a.s);
  // 日版和繁中同一张卡用的是同一张图，算一组；和「别的卡」比领先多少
  const same = (x) => x.c.lang !== "en" && scored[0].c.lang !== "en" && String(x.c.setId).toUpperCase() === String(scored[0].c.setId).toUpperCase() && x.c.localId === scored[0].c.localId;
  const rival = scored.find((x) => !same(x));

  const lead = rival ? scored[0].s - rival.s : 1;

  const pick = ok ? (scored.filter(same).find((x) => x.c.lang === "ja") || scored[0]).c : null;

async function ocrWords(canvas) {
  const w = await getWorker();
  const { data } = await w.recognize(canvas, {}, { text: true, blocks: true });
  const words = [];
  for (const b of data.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || []) for (const wd of l.words || []) words.push(wd);
  return { text: data.text || "", words };
}

// 系列代码常常印在小框里（比如 m1L），整条识别时容易被漏掉：
// 截取编号左边那一块，去掉框线、放大，再按单行单独识别一次
async function readCodeLeftOf(canvas, words) {
  const numWord = words.find((wd) => /\d{1,3}\s*\/\s*\d{2,3}/.test(wd.text));
  if (!numWord) return [];
  const { x0, y0, x1, y1 } = numWord.bbox, h = y1 - y0, nw = x1 - x0;
  const cx0 = Math.max(0, Math.round(x0 - Math.max(nw * 1.3, h * 4.5))), cx1 = Math.round(x0 - h * 0.1);
  const cy0 = Math.max(0, Math.round(y0 - h * 0.7)), cy1 = Math.min(canvas.height, Math.round(y1 + h * 0.7));
  if (cx1 - cx0 < h || cy1 - cy0 < 4) return [];
  const S = 2, W = (cx1 - cx0) * S, H = (cy1 - cy0) * S;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingQuality = "high";
  g.drawImage(canvas, cx0, cy0, cx1 - cx0, cy1 - cy0, 0, 0, W, H);
  const src = g.getImageData(0, 0, W, H), sp = src.data, n = W * H;
  const gray = new Float32Array(n);
  for (let j = 0; j < n; j++) gray[j] = sp[j * 4];
  // 局部均值（积分图）：比周围暗一截的是黑字，比周围亮一截的是白字（黑框里的代码就是白字）
  const ii = new Float64Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += gray[y * W + x]; ii[(y + 1) * (W + 1) + x + 1] = ii[y * (W + 1) + x + 1] + row; } }
  const r = Math.max(6, Math.round(h * S * 0.8)), mean = new Float32Array(n);
  for (let y = 0; y < H; y++) {
    const y0_ = Math.max(0, y - r), y1_ = Math.min(H, y + r + 1);
    for (let x = 0; x < W; x++) {
      const x0_ = Math.max(0, x - r), x1_ = Math.min(W, x + r + 1);
      mean[y * W + x] = (ii[y1_ * (W + 1) + x1_] - ii[y0_ * (W + 1) + x1_] - ii[y1_ * (W + 1) + x0_] + ii[y0_ * (W + 1) + x0_]) / ((x1_ - x0_) * (y1_ - y0_));
    }
  }
  const th = h * S, w = await getWorker(), tokens = [];
  await w.setParameters({ tessedit_pageseg_mode: "7" });
  try {
    for (const light of [false, true]) {
      const ink = new Uint8Array(n);
      for (let j = 0; j < n; j++) ink[j] = light ? (gray[j] > mean[j] + 18 ? 1 : 0) : (gray[j] < mean[j] - 18 ? 1 : 0);
      // 去框线：横向连续长度超过字高 2 倍、纵向超过字高 1.3 倍的，都当成线抹掉
      const kill = new Uint8Array(n);
      for (let y = 0; y < H; y++) { let run = 0; for (let x = 0; x <= W; x++) { if (x < W && ink[y * W + x]) run++; else { if (run > th * 2) for (let k = x - run; k < x; k++) kill[y * W + k] = 1; run = 0; } } }
      for (let x = 0; x < W; x++) { let run = 0; for (let y = 0; y <= H; y++) { if (y < H && ink[y * W + x]) run++; else { if (run > th * 1.3) for (let k = y - run; k < y; k++) kill[k * W + x] = 1; run = 0; } } }
      const out = g.createImageData(W, H), op = out.data;
      for (let j = 0; j < n; j++) { const v = ink[j] && !kill[j] ? 0 : 255; op[j * 4] = op[j * 4 + 1] = op[j * 4 + 2] = v; op[j * 4 + 3] = 255; }
      g.putImageData(out, 0, 0);
      const text = (await w.recognize(c)).data.text || "";
      tokens.push(...text.toUpperCase().split(/[\s\/]+/).map((s) => s.replace(/[^A-Z0-9.\-]/g, "")).filter((s) => s.length >= 2));
    }
  } finally { await w.setParameters({ tessedit_pageseg_mode: "11" }); }
  return [...new Set(tokens)];
}

// 按字形算的编辑距离：1/I/L/T、0/O/D、5/S 这类容易认错的字只算「半个错」
const LOOKALIKE = ["1ILTJ", "0ODQ", "5S", "8B", "2Z", "6G", "4A"];
const subCost = (a, b) => (a === b ? 0 : LOOKALIKE.some((g) => g.includes(a) && g.includes(b)) ? 0.4 : 1);
function wlev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + subCost(a[i - 1], b[j - 1])); prev = t; }
  }
  return d[b.length];
}
const NOT_CODE = new Set(["AR", "SAR", "SR", "UR", "RR", "RRR", "CHR", "CSR", "ACE", "HR", "EN", "MA", "BWR", "ILLUS"]);
const isCodeVote = (t) => t.length >= 2 && t.length <= 7 && /[A-Z]/.test(t) && !NOT_CODE.has(t);
// 多次读到的代码一起投票，看哪个候选系列明显得票最多
function voteResolve(cands, votes) {
  const sets = [...new Set(cands.map((c) => String(c.setId).toUpperCase()))];
  if (sets.length < 2 || !votes.length) return null;
  const sc = sets.map((s) => ({ s, v: votes.reduce((a, t) => a + Math.max(0, 2 - wlev(t, s)), 0) })).sort((a, b) => b.v - a.v);
  if (sc[0].v >= 2.5 && sc[0].v - sc[1].v >= 1) {
    const win = cands.filter((c) => String(c.setId).toUpperCase() === sc[0].s);
    return win.length === 1 ? win : null;
  }
  return null;
}

// 结果不确定（多张候选、没对上代码）时，补读代码再判断；votes 跨多次尝试累积
const confident = (cands) => cands.length === 1;
async function refineWithCode(canvas, words, parsed, votes = []) {
  const cands = await identify(parsed);
  if (confident(cands)) return { parsed, cands };
  const extra = await readCodeLeftOf(canvas, words);
  votes.push(...extra.filter(isCodeVote), ...parsed.tokens.filter(isCodeVote));
  let best = { parsed, cands };
  if (extra.length) {
    const p2 = { ...parsed, tokens: extra.concat(parsed.tokens.filter((t) => !extra.includes(t))) };
    const c2 = await identify(p2);
    if (confident(c2)) return { parsed: p2, cands: c2 };
    if (!cands.length) best = { parsed: p2, cands: c2 };
  }
  const pick = voteResolve(best.cands, votes);
  // 投票选出来的不算十拿九稳，带上全部候选，后面再用卡图核对
  return pick ? { parsed: best.parsed, cands: pick, viaVote: true, all: best.cands } : best;
}

// ---------- 解析卡底文字 ----------
// 卡底例子：日版「H SV8a 236/187 SAR」 繁中「H SV8a F 236/187」 美版「H PAF EN 232/091」 简中「CSV8C 100/207」
function parseText(text, manual) {
  // 代码外框、竖线之类当作空格
  // 简中 151 的代码是「151C」，读成 / 写成「151 C」也算
  const t = text.replace(/[|\\[\](){}<>]/g, " ").replace(/\s+/g, " ").trim().replace(/(^|\s)151 C(?=\s|$)/gi, "$1151C");
  const fix = (s) => s.replace(/[Oo]/g, "0").replace(/[lI]/g, "1");
  const nums = [];
  let m;
  const re = /(^|[^A-Za-z0-9])([0-9OolI]{1,3})\s*\/\s*([0-9OolI]{2,3})(?![0-9])/g;
  while ((m = re.exec(t))) nums.push({ n: parseInt(fix(m[2]), 10), total: parseInt(fix(m[3]), 10) });
  const rp = /(\d{1,3})\s*\/\s*([A-Za-z]{1,3}-P)\b/g;             // 日版特典卡：001/SV-P
  while ((m = rp.exec(t))) nums.push({ n: parseInt(m[1], 10), total: null, promo: m[2].toUpperCase() });
  const re2 = /\b([A-Za-z]{3})\s*EN\s*([0-9Oo]{3})(?!\s*\/)/g;     // 美版特典卡：SVP EN 001 / MEP EN 070（0 常被认成 O）
  while ((m = re2.exec(t))) nums.push({ n: parseInt(fix(m[2]), 10), total: null });
  const tokens = t.toUpperCase().split(/[\s\/]+/).map((s) => s.replace(/^[^A-Z0-9]+|[^A-Z0-9]+$/g, "")).filter(Boolean);
  if (manual && !nums.length) {
    const mm = t.match(/(?:^|\s)(\d{1,3})\s*$/);                   // 手动输入：SV8a 236
    if (mm) nums.push({ n: parseInt(mm[1], 10), total: null });
  }
  // 斜体斜杠常被认成 7 或 1：「1007076」= 100/076，「597066」「597 066」= 59/066（开头的 0 也常丢）
  if (!nums.length) {
    const rs = /(?:^|[^0-9])(\d{1,3})\s?[71Il|]\s?(0\d{2})(?![0-9])/g;
    while ((m = rs.exec(t))) nums.push({ n: parseInt(m[1], 10), total: parseInt(m[2], 10), loose: true });
  }
  // 不可能的读数（编号 0、总数不到 10）多半是杂讯，丢掉
  for (let i = nums.length - 1; i >= 0; i--) if (!(nums[i].n > 0) || (nums[i].total != null && nums[i].total < 10)) nums.splice(i, 1);
  // 总数线索：「/076」「7076」这类，编号读不全时用来锁定系列
  const totalHints = [...new Set((t.match(/[\/71Il|](0\d{2})(?![0-9])/g) || []).map((s) => parseInt(s.slice(1), 10)))];
  nums.forEach((x) => { if (x.total && !totalHints.includes(x.total)) totalHints.push(x.total); });
  // 繁中：系列代码后面跟一个单独的 F（注意：代码前面的 F 是赛制标记，不算）
  const twPrev = [];
  tokens.forEach((s, i) => { if (s === "F" && i > 0) twPrev.push(tokens[i - 1]); });
  // 单独的三位数（特典卡只印「MEP EN 070」，黑框里的代码常读不出来，只剩 070）
  const lone = nums.length ? [] : [...new Set(tokens.filter((s) => /^\d{3}$/.test(s)).map((s) => parseInt(s, 10)).filter((x) => x > 0 && x < 400))];
  return { nums, tokens, twPrev, totalHints, lone, manual: !!manual, en: tokens.includes("EN"), raw: t };
}

// 编辑距离：代码读错一两个字时用来找最接近的系列
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return d[b.length];
}
function nearestSet(list, U, parsed) {
  const totals = parsed.nums.map((x) => x.total).filter(Boolean);
  let best = null, bestScore = Infinity;
  for (const s of list) {
    const dist = lev(U, String(s.id).toUpperCase());
    if (dist > 2) continue;
    const score = dist - (s.cardCount && totals.includes(s.cardCount.official) ? 1.5 : 0);
    if (score < bestScore) { best = s; bestScore = score; }
  }
  return best;
}

// ---------- 识别是哪张卡、哪种语言 ----------
async function identify(parsed) {
  const idx = await getIndex();
  const hits = [];
  const addHit = (lang, set, score) => {
    if (!set) return;
    const h = hits.find((x) => x.lang === lang && x.set.id === set.id);
    if (h) h.score = Math.max(h.score, score); else hits.push({ lang, set, score });
  };
  const inJaTw = (u) => idx.ja.map.has(u) || idx["zh-tw"].map.has(u);
  const tw = parsed.twPrev.some(inJaTw);
  const codeTokens = parsed.tokens.filter((s) => /[A-Z]/.test(s) && s.length >= 2 && s !== "EN");
  const totals = parsed.nums.map((x) => x.total).filter(Boolean);
  for (const U of codeTokens) {
    // 美版：系列简称 + EN
    const enKey = EN_ABBR[U] ? U : (U.length > 4 && U.endsWith("EN") && EN_ABBR[U.slice(0, -2)] ? U.slice(0, -2) : null);
    // 手动输入时不写 EN 也行（mep 070），只要不和日版系列代码重名
    if (enKey && (parsed.en || enKey !== U || (parsed.manual && !inJaTw(U)))) addHit("en", idx.en.map.get(EN_ABBR[enKey].toUpperCase()), 3);
    // 简中：C 开头 C 结尾的商品编号
    if (/^C[A-Z0-9.]{2,}C$/.test(U)) addHit("zh-cn", idx["zh-cn"].map.get(U) || nearestSet(idx["zh-cn"].list, U, parsed) || { id: U, name: "" }, 3);
    // 简中 151：代码不是 C…C 格式，TCGdex 里也没有，卡表和价格用 PriceCharting 的
    if (/^151C\d?$/.test(U)) addHit("zh-cn", ZH_CN_PC["151C"], 3.5);
    // 日版 / 繁中：代码相同，繁中多一个 F
    let base = U, glued = false;
    if (!inJaTw(U) && U.endsWith("F") && inJaTw(U.slice(0, -1))) { base = U.slice(0, -1); glued = true; }
    if (inJaTw(base)) {
      const jaS = idx.ja.map.get(base), twS = idx["zh-tw"].map.get(base);
      if (tw || glued) addHit("zh-tw", twS || jaS, 3);
      else if (!parsed.en) addHit(jaS ? "ja" : "zh-tw", jaS || twS, 2);
    }
  }
  // 代码读错一个字（比如 M1L 读成 MIL）：编号总数对得上的日版 / 繁中系列
  if (!hits.length && !parsed.en && totals.length) {
    for (const U of codeTokens) {
      for (const s of idx.ja.list) {
        if (!(s.cardCount && totals.includes(s.cardCount.official))) continue;
        const id = String(s.id).toUpperCase();
        const d = wlev(U, id), dF = U.endsWith("F") ? wlev(U.slice(0, -1), id) : 9;
        if (Math.min(d, dF) > 1) continue;
        const isTw = dF < d || parsed.twPrev.some((p) => wlev(p, id) <= 1);
        // 只差一个形近字（1/I/L）算比较可信，否则分数低一些，留给多次投票决定
        addHit(isTw ? "zh-tw" : "ja", isTw ? idx["zh-tw"].map.get(id) || s : s, Math.min(d, dF) <= 0.4 ? 2 : 1.5);
      }
    }
  }
  // 卡上没有系列代码（老卡、Classic Collection 这类复刻卡）：
  // TCGplayer 按卡面印的编号记录，复刻卡也查得到。复刻卡连版权年份都照抄原版，只能靠卡图（边框颜色等）区分
  let tpCands = [];
  if (!hits.length && proxyUrl() && totals.length) tpCands = await tcgNumberCandidates(parsed);
  // 卡面完全没读到系列代码：多半是美版老卡或复刻卡（现在的日版卡都印代码），美版候选排前面
  if (!codeTokens.some((s) => /\d/.test(s))) tpCands.forEach((c) => (c.score = 2.3));
  // 再按「编号/总数」在 TCGdex 各语言里找（美版已经由 TCGplayer 找过就跳过），两边候选合在一起
  if (!hits.length) {
    const hasCode = codeTokens.some((s) => /\d/.test(s));
    let order = parsed.en ? ["en"] : hasCode ? ["ja", "zh-tw", "en"] : ["en", "ja", "zh-tw"];
    if (tpCands.length) order = order.filter((l) => l !== "en");
    for (const total of totals) {
      for (const l of order) idx[l].list.filter((s) => s.cardCount && s.cardCount.official === total).slice(-6).reverse().forEach((s) => addHit(l, s, 1));
    }
  }
  hits.sort((a, b) => b.score - a.score);
  const out = [];
  for (const h of hits.slice(0, 12)) {
    for (const num of parsed.nums) {
      if (num.promo && String(h.set.id).toUpperCase() !== num.promo) continue;
      const off = h.set.cardCount && h.set.cardCount.official;
      const bonus = num.total && off ? (off === num.total ? 1 : -1) : 0;
      const c = await candidate(h.lang, h.set, num);
      if (c) {
        c.score = h.score + bonus;
        if (!out.some((x) => x.lang === c.lang && x.id === c.id)) out.push(c);
        continue;
      }
      // 系列对上了但没有这个编号：多半是斜体数字认错（1↔7、0↔8…），试一下形近数字，交给卡图挑
      if (h.score >= 2) {
        for (const alt of lookalikeNums(num.n)) {
          const c2 = await candidate(h.lang, h.set, { ...num, n: alt });
          if (c2 && !out.some((x) => x.lang === c2.lang && x.id === c2.id)) { c2.score = h.score + bonus - 0.5; out.push(c2); }
        }
      }
    }
  }
  out.push(...tpCands);
  // 什么都没找到、或者只有很弱的候选：编号和总数都可能读错了（110/080 读成 770/50，076 读成 075），
  // 换形近数字再找日版候选，交给卡图挑
  // （读到的编号 / 总数已经能直接对上某个系列时不做：形近数字只会混进错的卡）
  if (!out.some((c) => (c.score || 0) >= 2) && !parsed.en && !tpCands.length) {
    const officials = new Set(idx.ja.list.map((s) => s.cardCount && s.cardCount.official));
    for (const num of parsed.nums.filter((x) => x.total)) {
      const totals = [num.total, ...lookalikeNums(num.total)].filter((t) => officials.has(t));
      for (const t of totals.slice(0, 4)) {
        const sets = idx.ja.list.filter((s) => s.cardCount && s.cardCount.official === t).slice(-3);
        for (const s of sets) for (const n of [num.n, ...lookalikeNums(num.n)]) {
          if (out.length >= 12) break;
          const c = await candidate("ja", s, { n, total: t });
          if (c && !out.some((x) => x.id === c.id)) { c.score = 1.5; out.push(c); }
        }
      }
    }
  }
  out.sort((a, b) => b.score - a.score);
  if (!out.length) return out;
  const top = out[0].score;
  return top >= 3 ? out.filter((c) => c.score === top) : out.slice(0, 10);
}

// 斜体数字容易认错的几对：换掉其中一位
const DIGIT_LOOKALIKE = { 1: "7", 7: "1", 0: "869", 8: "03695", 6: "8505", 5: "6398", 3: "859", 9: "0538" };
// 形近编号：1↔7 可以同时换好几位（斜体的系统性混淆），其他数字最多换一位
function lookalikeNums(n) {
  const s = String(n).padStart(3, "0"), out = new Set(), bases = new Set([s]);
  const idx17 = [...s].map((c, i) => (c === "1" || c === "7" ? i : -1)).filter((i) => i >= 0);
  for (let mask = 1; mask < 1 << idx17.length; mask++) {
    const a = [...s]; idx17.forEach((i, k) => { if (mask & (1 << k)) a[i] = a[i] === "1" ? "7" : "1"; }); bases.add(a.join(""));
  }
  for (const b of bases) {
    out.add(parseInt(b, 10));
    for (let i = 0; i < b.length; i++) for (const d of DIGIT_LOOKALIKE[b[i]] || "") if (b[i] !== "1" && b[i] !== "7") out.add(parseInt(b.slice(0, i) + d + b.slice(i + 1), 10));
  }
  // 开头的 1 常被吞掉（112 读成 72 / 12）：两位数也试试前面补 1
  if (n < 100) for (const v of [n, ...out]) if (v < 100) out.add(100 + v);
  out.delete(n);
  return [...out].filter((x) => x > 0);
}

// 用 TCGplayer 按印刷编号找美版卡（老卡、复刻卡卡面没有系列代码）
const numVariants = (n, total) => [...new Set([`${n}/${total}`, `${String(n).padStart(3, "0")}/${total}`, `${String(n).padStart(3, "0")}/${String(total).padStart(3, "0")}`])];
async function tcgNumberCandidates(parsed) {
  const out = [];
  for (const { n, total } of parsed.nums) {
    if (!total) continue;
    // 有的记成 4/102，有的记成 004/102（比如 Base Set 原版），几种写法都搜
    let items = [];
    for (const q of numVariants(n, total)) {
      try { items = items.concat((await tcgSearch(q, "pokemon")) || []); } catch {}
    }
    for (const p of items) {
      const [a, b] = String(p.number).split("/").map((s) => parseInt(s, 10));
      if (a !== n || b !== total || /jumbo/i.test(p.set) || out.some((x) => x.tpId === p.id)) continue; // 巨型卡不算
      out.push({ lang: "en", tpOnly: true, tpId: p.id, id: "tp" + p.id,
        name: String(p.name).replace(/\s*-\s*\d+\/\d+.*$/, ""), setName: p.set, setId: "", localId: String(n), official: total,
        rel: p.rel || null, tpPrice: p.price, score: 2 });
    }
  }
  return out;
}
// 在某个系列里找第 n 张卡
async function candidate(lang, set, num) {
  const n = num.n;
  if (lang === "zh-cn" && set.pc) {
    const q = `${set.pc} #${n}`;
    let j = null;
    try { j = await pcLookup(q, n); } catch {}
    if (j && j.title) {
      const lid = String(n).padStart(3, "0");
      return { lang, id: `${set.id}-${lid}`, localId: lid, name: j.title.replace(/\s*#\d+.*$/, ""), pcq: q, pcImg: j.img || "",
        setId: set.id, setName: set.name, official: num.total || null, rel: null };
    }
  }
  if (lang === "zh-cn") {
    let det = null;
    try { det = await getSetCached("zh-cn", set.id); } catch {}
    const card = det && det.cards.find((c) => parseInt(c[1], 10) === n);
    if (card) return { lang, id: card[0], localId: card[1], name: card[2], image: card[3], setId: det.id, setName: det.name, official: det.official, rel: det.rel };
    const lid = String(n).padStart(3, "0");
    return { lang, manual: true, id: `${set.id}-${lid}`, localId: lid, name: "", setId: set.id,
      setName: (det && det.name) || set.name || "", official: num.total || (det && det.official) || null, rel: det && det.rel };
  }
  // 繁中库里没有的系列，用同代码的日版资料
  const idx = await getIndex();
  const dataLang = lang === "zh-tw" && !idx["zh-tw"].map.has(String(set.id).toUpperCase()) ? "ja" : lang;
  let det;
  try { det = await getSetCached(dataLang, set.id); } catch { return null; }
  const card = det.cards.find((c) => parseInt(c[1], 10) === n);
  if (!card) return null;
  const c = { lang, id: card[0], localId: card[1], name: card[2], image: card[3], setId: det.id, setName: det.name, abbr: det.abbr, official: det.official, rel: det.rel };
  if ((!c.image || !c.rel) && lang === "zh-tw") {
    try {
      const jd = await getSetCached("ja", set.id);
      const jc = jd.cards.find((x) => parseInt(x[1], 10) === n);
      if (jc && !c.image) c.image = jc[3];
      c.rel = c.rel || jd.rel;
    } catch {}
  }
  return c;
}

// 日版 ↔ 繁中 互换（F 没读到时可以手动纠正）
async function counterpart(c) {
  if (c.lang !== "ja" && c.lang !== "zh-tw") return null;
  const other = c.lang === "ja" ? "zh-tw" : "ja";
  const idx = await getIndex();
  const U = String(c.setId).toUpperCase();
  const s = idx[other].map.get(U) || (other === "zh-tw" ? idx.ja.map.get(U) : null);
  if (!s) return null;
  return candidate(other, s, { n: parseInt(c.localId, 10), total: c.official });
}

function autoSave(c, el) {

// 每一帧换一种处理方式轮流试：
//   left = 只截左下角放大（现在的卡编号都在左下），否则截整条（老卡编号在右下）
//   light = 反色（全图卡的白字编号、黑框里的白字代码）；adaptive = 局部二值化（反光、明暗不均）
//   dy = 上下错位（卡没完全对准黄色虚线时也能读到编号那一行）
const FRAME_VARIANTS = [
  { left: true }, { left: true, light: true }, { left: true, dy: -0.06 }, { left: true, light: true, dy: -0.06 },
  { left: true, adaptive: true }, {}, { left: true, dy: 0.05 }, { left: true, light: true, dy: 0.05 },
  { left: true, dy: -0.11 }, { left: true, light: true, dy: -0.11 }, { light: true }, { adaptive: true, dy: -0.06 },
  { left: true, light: true, adaptive: true }, { left: true, angle: -5 }, { left: true, angle: 5 }, { left: true, light: true, angle: -5, dy: -0.04 },
  { left: true, light: true, angle: 5, dy: -0.04 }, { angle: -9 }, { angle: 9 }, { dy: -0.1 },
];

// 取相机画面里引导框底部编号那一行（留出上下余量，卡歪一点也框得住）
function grabStrip(variant) {
  const g = guideGeom();
  return g && stripFrom($("video"), g, variant);
}
// 引导框在相机画面（视频原始像素）里的位置
function guideGeom() {
  const v = $("video"), vf = $("vf"), g = $("guide");
  const vw = v.videoWidth, vh = v.videoHeight; if (!vw) return null;
  const box = vf.getBoundingClientRect(), gb = g.getBoundingClientRect();
  const s = Math.max(box.width / vw, box.height / vh); // object-fit: cover 的换算
  const ox = (vw * s - box.width) / 2, oy = (vh * s - box.height) / 2;
  return { gx: (gb.left - box.left + ox) / s, gy: (gb.top - box.top + oy) / s, gw: gb.width / s, gh: gb.height / s };
}
// 从画面（相机 / 存下的帧 / 照片）里按卡片位置截卡底那一行
function stripFrom(src, { gx, gy, gw, gh }, variant) {
  const dy = (variant.dy || 0) * gh;
  if (variant.left) return prep(src, gx - gw * 0.05, gy + gh * 0.865 + dy, gw * 0.7, gh * 0.14, { target: 1600, ...variant });
  return prep(src, gx - gw * 0.05, gy + gh * 0.84 + dy, gw * 1.1, gh * 0.19, { target: 1400, ...variant });
}

// opts.noGuess：上次列出来的卡都不是，这次不用整卡比对，只用读字的方法认
async function startScan(opts = {}) {
  cancelBg();
  if (!hasLiveCam) { $("shootIn").click(); return; }
  if (!stream && !(await openCam())) return;
  $("preview").hidden = true;
  $("results").innerHTML = "";
  scanning = true; setScanUI("scanning");
  const my = ++loopId;
  try { await getWorker(); } catch (e) { setStatus("识别引擎加载失败，请检查网络：" + esc(e.message)); stopScan(); return; }
  setStatus("把卡放进框里，底部编号对准黄色虚线…");
  const recent = [];           // 最近几帧的读数
  let frame = -1, unsure = 0, unsureBest = null, votes = [], voteSig = "", stick = false;
  const startedAt = Date.now(); let lastHit = Date.now();
  let framesDone = 0, noNumFrames = 0, deepTried = false, aiTries = 0, nameTries = 0, nameFor = "", namePending = null;
  // 读卡片顶部的卡名（卡没完全对准时会偏上偏下，读两三个位置合起来）
  const readNameText = async (english) => {
    let text = await ocrName(liveNameCrop(), english);
    text += " " + (await ocrName(liveNameCrop({ dy: -0.02 }), english));
    if (normName(text).replace(/\d/g, "").length < 4) text += " " + (await ocrName(liveNameCrop({ dy: 0.02, light: true }), english));
    return text;
  };
  // 开始扫描几秒后在后台先把中日文字库下载好，第一次需要读卡名时就不用等
  setTimeout(() => { if (my === loopId) getNameWorker().catch(() => {}); }, 3000);
  // 请 AI 读卡底（每次扫描最多两次）；认出来了返回 true（扫描结束）
  const tryAi = async () => {
    if (aiTries >= 2 || !proxyUrl() || aiDisabled) return false;
    aiTries++;
    const crop = liveAiCrop();
    if (!crop) return false;
    setStatus("正在请 AI 帮忙读卡底…");
    const text = await aiRead(crop);
    if (my !== loopId) return true;
    if (!text) return false;
    $("ocrPeek").hidden = false; $("ocrPeek").textContent = "AI 读到：" + text;
    const res = await resolveAiText(text, liveCardSigs().concat(slideSigs($("video"), 0, true))).catch(() => null);
    if (my !== loopId) return true;
    if (res && res.pick) {
      await showResults(res.parsed, true, [res.pick]);
      $("status").insertAdjacentHTML("beforeend", ` · AI 读卡底：${esc(text)}`);
      finishScan(); return true;
    }
    if (res && res.list.length > 1) { await showResults(res.parsed, true, await orderByImage(res.list, [], res.parsed.nums)); finishScan(); return true; }
    return false;
  }; const hintTotals = new Map(), seenCands = [], searchedSets = new Set(), triedLone = new Set();
  // 整卡比对：和下面读字的循环同时跑，谁先认出来用谁。目标是 1 秒左右给结果：
  // · 认出卡图、只有一个版本（或卡底文字挑得出版本）：马上显示
  // · 认出卡图但有几个版本：最多再等 0.6 秒读卡底，读不到就列出几个版本让你点
  // · 拿不准是哪张卡：扫了 1.2 秒还这样，就列出最像的几张，附「都不是，继续识别」（之后只用读字的方法慢慢认）
  // 卡底读到简中代码时交给读字的方法（简中卡和日版同图）
  if (!opts.noGuess) (async () => {
    if (!(await loadVis()) || my !== loopId) return;
    const gpu = (await vis.loadModel()).device === "webgpu"; // 没有显卡加速时每帧只算一次，免得手机发烫
    let last = null, lastAny = null, k = 0, fam = null, famSince = 0, firstAt = 0;
    const accept = async (r, pick) => {
      loopId++; // 先停住读字的循环
      // 要你选的时候：先存几帧画面再关相机，候选马上列出来，后台接着读卡底，读出来自动选好
      const shots = pick.sure ? [] : await snapFrames();
      const hints = recent.slice();
      await visShow(r, true, hints, pick, pick.sure ? null : () => startScan({ noGuess: true }));
      finishScan();
      if (shots.length && r.shown && r.shown.length > 1) bgResolve(shots, r.shown, hints);
    };
    while (scanning && my === loopId) {
      if (fam) {
        const pick = visPick(fam, recent);
        if (pick.sure || Date.now() - famSince > 600) return accept(fam, pick);
      }
      let r = null;
      // 试框本身和往里缩的几种大小（卡装在卡砖里、离得远一点，卡就比框小），取最像的
      try {
        const insets = gpu ? (k % 2 ? [0.06, 0.18] : [0, 0.12]) : [[0, 0.06, 0.12, 0.18][k % 4]];
        k++;
        for (const inset of insets) {
          const c = liveCardCanvas(inset), x = c && (await visDecide(c));
          if (x && (!r || x.best.sim > r.best.sim)) r = x;
        }
      } catch {}
      if (!scanning || my !== loopId) return;
      if (!r) { await sleep(200); continue; }
      firstAt = firstAt || Date.now();
      const zhcn = recent.some((p) => p.tokens.some((t) => /^C[A-Z0-9.]{2,}C$|^151C\d?$/.test(t)));
      // 1.5 秒内两次认出同一张卡图才算（中间夹着没认出的帧也没关系），一次就非常确定的直接算
      const again = r.ok && last && last.key === r.key && Date.now() - last.at < 1500;
      const steady = lastAny && lastAny.key === r.key && Date.now() - lastAny.at < 1500;
      if (r.ok) last = { key: r.key, at: Date.now() };
      lastAny = { key: r.key, at: Date.now() };
      if (zhcn) { fam = null; await sleep(300); continue; }

// ---------- 整卡比对（像淘宝拍照搜：整张卡图变成 384 个数字，和事先算好的卡图库比，最像的就是） ----------

let vis = null, visIndex = null, visLoading = null;

    const peek = $("visPeek"), prog = {};

      const files = Object.values(prog), got = files.reduce((a, f) => a + f[0], 0), all = files.reduce((a, f) => a + f[1], 0);
      if (visIndex) return; // 加载完以后迟到的进度不显示
      if (!all || got >= all) { peek.hidden = true; return; }
      peek.hidden = false;
      peek.textContent = `正在下载整卡识别模型（只有第一次）… ${(got / 1048576).toFixed(0)} / ${(all / 1048576).toFixed(0)} MB`;
    };
    visLoading = (async () => {
      vis = await import("./vis.js");
      const [, idx] = await Promise.all([
        vis.loadModel((p) => { if (p.status === "progress" && p.total > 1e6) { prog[p.file] = [p.loaded, p.total]; show(); } }),
        vis.loadIndex("./vis/", (got, total) => { prog.index = [got, total || got]; show(); }),
      ]);

      await vis.embed(document.createElement("canvas")).catch(() => {});
      visIndex = idx; peek.hidden = true;
      store.set("ptcg.visOk", 1);
      return true;
    })().catch((e) => { console.warn("整卡识别不可用：", e); visLoading = null; peek.hidden = true; return false; });
  }

}
// 打开网页就在后台把读字引擎准备好；用过整卡识别（模型已经存在手机里）的也一起准备，第一次扫描不用等
setTimeout(() => { getWorker().catch(() => {}); if (store.get("ptcg.visOk", 0)) loadVis(); }, 1200);

const cleanTpName = (s) => String(s || "").replace(/\s+-\s+[\w/-]*\d[\w/-]*(?=\s*\(|\s*$)/, "").trim();

// 同一张卡图常有好几个版本（日版 / 美版 / 复刻 / Prize Pack），卡图几乎一样，算作一家（family），后面再用卡底文字挑
async function visDecide(canvas) {
  const q = await vis.embed(canvas);
  const top = vis.search(visIndex, q, 16).map((t) => ({ ...t, p: visItem(t.i) }));
  const best = top[0];
  const sameName = (t) => baseName(t.p.name) === baseName(best.p.name);
  const rival = top.find((t) => !sameName(t));
  const margin = best.sim - (rival ? rival.sim : 0);
  const ok = (best.sim >= 0.7 && margin >= 0.06) || (best.sim >= 0.8 && margin >= 0.04);

  return { ok, strong: ok && best.sim >= 0.78 && margin >= 0.08, best, family, margin, key: baseName(best.p.name), top };

// 在同一张卡图的几个版本里，用读到的卡底文字挑：编号、总数、EN、日版系列代码
// 挑得出来返回 [那一张]；挑不出来，最像的又领先不多，就按相似度全列出来
function visPick(r, hints = []) {

  const score = (t) => {
    const [a, b] = String(t.p.number).split("/").map((x) => parseInt(x, 10));
    let s = 0, strong = false;
    const m = nums.find((x) => x.n === a);

const visGuess = (r, max = 4) => {
  const seen = new Set(), list = [];
  for (const t of r.top) { const k = baseName(t.p.name); if (seen.has(k)) continue; seen.add(k); list.push(t); if (list.length >= max) break; }

// ---------- 列出候选以后：用存下的画面在后台继续读卡底，读出来就自动帮你选好 ----------
// 不用一直举着手机，也不用自己挑；你先点了、或者开始扫下一张，后台就停
let bgToken = 0;

// 存几帧相机画面（连同引导框位置），相机关掉以后还能接着读
async function snapFrames(n = 3, gap = 80) {
  const v = $("video"), g = guideGeom(), out = [];
  if (!g) return out;
  for (let i = 0; i < n; i++) {
    const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;

    "price-desc": (a, b) => (b.price ?? -1) - (a.price ?? -1) || byNum(a, b),
    "price-asc": (a, b) => (a.price ?? Infinity) - (b.price ?? Infinity) || byNum(a, b),
    // 没有发售日期的排最后

  $("shChg").textContent = flat ? `— ${fmt(0)}` : `${d > 0 ? "▲" : "▼"} ${fmt(Math.abs(d))}`;
  $("shChg").className = "chg " + (flat ? "flat" : d > 0 ? "up" : "down");
  $("shNote").textContent = `${source} · ${pcOnly ? RANGE_NOTE[shRange].replace(/（.*）/, "（每月一个点）") : RANGE_NOTE[shRange]}${shRange !== "all" && new Date(pts[0].d) - new Date(from) > 45 * DAY ? `（只查到 ${pts[0].d.slice(0, 7)} 以后的）` : ""}。手指在图上滑动可以看每个点。`;
  $("shVol").parentElement.hidden = !pts.some((p) => p.q); // 长期数据没有成交量
}
// 单条曲线：2px 线 + 淡面积，弱化网格，标出最新一点；手指 / 鼠标滑动显示十字线和数值
function drawChart(el, pts) {
  const W = el.clientWidth || 340, H = el.clientHeight || 200, padL = 50, padR = 10, padT = 34, padB = 22;
  const vals = pts.map((p) => fromUsd(p.p));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { hi *= 1.05; lo *= 0.95; }
  const pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi += pad;
  const n = pts.length, X = (i) => padL + (i / (n - 1)) * (W - padL - padR), Y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const c = CUR[cur];
  const short = (v) => c.sym + (v >= 10000 ? Math.round(v / 1000) + "k" : v >= 1000 ? (v / 1000).toFixed(1) + "k" : v.toFixed(c.dec && v < 100 ? 2 : 0));
  // 跨度超过一年的按「年/月」标日期，否则按「月/日」
  const long = new Date(pts[n - 1].d) - new Date(pts[0].d) > 400 * DAY;
  const dl = (d) => (long ? d.slice(0, 7) : d.slice(5)).replace("-", "/");
  const ticks = [0, 1, 2, 3].map((k) => lo + ((hi - lo) * k) / 3);
  const line = vals.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const area = `${line}L${X(n - 1).toFixed(1)},${H - padB}L${X(0).toFixed(1)},${H - padB}Z`;
  const gid = "g" + Math.random().toString(36).slice(2, 7);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="价格走势：${pts[0].d} ${fmt(pts[0].p)}，${pts[n - 1].d} ${fmt(pts[n - 1].p)}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.24"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
    ${ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" style="stroke:var(--line);stroke-width:1"/>
      <text x="${padL - 6}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end" style="fill:var(--muted);font:10.5px var(--mono)">${short(t)}</text>`).join("")}
    <text x="${padL}" y="${H - 5}" style="fill:var(--muted);font:10.5px var(--font)">${dl(pts[0].d)}</text>
    <text x="${W - padR}" y="${H - 5}" text-anchor="end" style="fill:var(--muted);font:10.5px var(--font)">${dl(pts[n - 1].d)}</text>
    <path d="${area}" style="fill:url(#${gid})"/>
    <path d="${line}" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
    <circle cx="${X(n - 1).toFixed(1)}" cy="${Y(vals[n - 1]).toFixed(1)}" r="4.5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/>
    <g data-xh style="display:none"><line data-l y1="${padT - 4}" y2="${H - padB}" style="stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3"/>
      <circle data-c r="5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/></g>
    <rect x="0" y="0" width="${W}" height="${H}" style="fill:transparent"/>
  </svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), g = svg.querySelector("[data-xh]"), L = svg.querySelector("[data-l]"), C = svg.querySelector("[data-c]"), tip = el.querySelector(".tip");
  const show = (clientX) => {
    const r = svg.getBoundingClientRect(), x = ((clientX - r.left) * W) / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round(((x - padL) / (W - padL - padR)) * (n - 1))));
    g.style.display = ""; L.setAttribute("x1", X(i)); L.setAttribute("x2", X(i)); C.setAttribute("cx", X(i)); C.setAttribute("cy", Y(vals[i]));
    tip.hidden = false;
    tip.innerHTML = `${pts[i].d} · <b>${fmt(pts[i].p)}</b>${pts[i].q ? ` · 成交 ${pts[i].q}` : ""}`;
    tip.style.left = Math.max(80, Math.min(r.width - 80, (X(i) * r.width) / W)) + "px";
  };
  const hide = () => { g.style.display = "none"; tip.hidden = true; };
  svg.addEventListener("pointermove", (e) => show(e.clientX));
  svg.addEventListener("pointerdown", (e) => show(e.clientX));
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("pointercancel", hide);
}

// 卡片可点击：点到按钮、输入框以外的地方就打开价格曲线
function makeClickable(el, x) {

}

  if (scan) { $("navScan").setAttribute("aria-current", "page"); $("navLib").removeAttribute("aria-current"); }
  else { $("navLib").setAttribute("aria-current", "page"); $("navScan").removeAttribute("aria-current"); }

}
