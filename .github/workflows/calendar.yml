# 每天更新发售日历：简中官网（Worker 下载不了图片）→ cal-cn.json；美版建议零售价（The Lab TCG）→ cal-msrp.json
# 第一次跑时顺便把识别模型（42MB）放进网站，这样在中国也能下载
name: 更新发售日历
on:
  schedule:
    - cron: "17 9 * * *"   # 每天 UTC 9:17（北京时间 17:17）
  workflow_dispatch:        # 也可以在 Actions 页面手动跑
permissions:
  contents: write
concurrency:
  group: push-main          # 和更新卡图库的任务错开，免得同时提交
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm i --no-save sharp@0.33.5
      - run: node tools/calendar.mjs
      - name: 翻译（简中 / 日文 / 英文互译，提前做好）
        continue-on-error: true   # 翻译出问题不影响日历本身
        run: node tools/translate-cal.mjs
      - name: 图鉴简中卡表和价格（PriceCharting）
        continue-on-error: true
        run: node tools/build-cn.mjs
      - name: 识别模型
        run: |
          f=models/Xenova/dinov2-small/onnx/model_fp16.onnx
          if [ ! -f "$f" ]; then mkdir -p "$(dirname "$f")" && curl -fL -o "$f" https://huggingface.co/Xenova/dinov2-small/resolve/main/onnx/model_fp16.onnx; fi
      - name: 有变化就提交
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add -A cal-cn.json cal-msrp.json cal-img models && { [ ! -f cal-tr.json ] || git add cal-tr.json; } && { [ ! -f cn-dex.json ] || git add cn-dex.json; }
          git diff --cached --quiet || (git commit -m "更新发售日历" && git pull --rebase -X theirs && git push)
